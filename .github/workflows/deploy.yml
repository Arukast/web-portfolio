name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: Arukast/Shared-CICD/.github/workflows/deploy-app.yml@main
    with:
      node_version: '22'
      package_manager: 'npm'
      check_command: 'npx astro check'
      build_command: 'npm run build'
      dist_dir: 'dist'

      # Cloudflare Pages deployment
      enable_cloudflare: true
      cloudflare_project_name: 'portfolio-web-alta'
      production_branch: 'main'

      # Vercel deployment (set to true if you also want Vercel)
      enable_vercel: false

      # PR Comment & Lighthouse audits
      enable_pr_comment: true
      enable_lighthouse: true
      lighthouse_routes: |
        /
        /projects

    secrets: inherit
